# Read-only front end for the VC-FHE QBFT network.
#
# The dashboard is served from /, /rpc is a same-origin reverse proxy to
# node1's JSON-RPC endpoint, and /ws is the same proxy for its WebSocket
# endpoint. The proxies exist so the page works from any host and never
# depends on the browser's CORS handling; they forward requests unchanged and
# add nothing. Nothing here writes to the chain: the dashboard issues only
# eth_*, net_* and qbft_* read calls, and subscribes to newHeads, logs and
# newPendingTransactions.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location = /rpc {
        proxy_pass http://node1:8545/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type application/json;
        proxy_read_timeout 30s;
    }

    # Push channel: eth_subscribe over WebSocket, so the page is told about a
    # block the moment it is sealed instead of discovering it on the next poll.
    # The read timeout is long because a healthy subscription is idle between
    # blocks; the page also sends its own keep-alive.
    location = /ws {
        proxy_pass http://node1:8546/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ethers is served from the repository's own install when it is present,
    # so the dashboard works with no internet access. index.html falls back to
    # a CDN when this path 404s.
    location = /vendor/ethers.umd.min.js {
        alias /repo/fhe-pod/node_modules/ethers/dist/ethers.umd.min.js;
        add_header Cache-Control "public, max-age=86400";
    }

    # The deployment manifest gives the dashboard the non-linear contract
    # addresses; it is optional and read-only.
    location /deployment/ {
        alias /repo/network/;
        autoindex off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
