# Hyperledger Besu QBFT network for VC-FHE: 4 validators, Byzantine
# fault-tolerant consensus (tolerates 1 faulty validator), RPC on :8550 and
# the read-only WebSocket subscription endpoint of node1 on :8551. Nodes 2--4
# expose HTTP RPC only inside the Compose network so distinct KMS cores can
# verify the on-chain release policy against distinct validators.
#
# Everything consensus-critical (validator keys, QBFT extraData, genesis) is
# generated by Besu itself on first start (`besu operator
# generate-blockchain-config`, the flow of the official QBFT tutorial), so
# no hand-crafted encoding is involved. The genesis prefunds the standard
# dev mnemonic (`test test ... junk`) used by all tooling in this repository.
#
# Current campaign: run ./run-poc.sh from VC-FHE. Its setup starts this
# network and preserves the release policy and cumulative record counters.
# See ../../REPRODUCE.md for prerequisite checks and the largest-case pilot.
# Manual network commands are component maintenance, not campaign reproduction.
# Never remove the volumes or reset the chain to recover an interrupted campaign.

x-besu: &besu
  # 25.3.0 is the first release carrying the fix for CVE-2025-30147: releases
  # 24.7.1 through 25.2.2 omit the curve-equation check for G2 inputs to the
  # alt_bn128 precompiles, which the MKLHS enrollment check relies on.
  image: hyperledger/besu:25.3.0
  restart: unless-stopped

x-node-defaults: &node-args
  # QBFT + JSON-RPC flags shared by every validator.
  BESU_GENESIS_FILE: /opt/net/genesis.json
  BESU_HOST_ALLOWLIST: "*"
  BESU_P2P_PORT: "30303"
  # Every validator advertises its own container address (--p2p-host) and NAT
  # detection is switched off (--nat-method=NONE). With the default AUTO, Besu
  # selects its Docker NAT manager, whose host detection is unreliable under
  # Docker Desktop and WSL2: the node starts and answers JSON-RPC but never
  # brings P2P up, which shows as 0 peers on every node and a chain stuck at
  # height 0.

services:
  # One-shot: generate validator keys + QBFT genesis into the shared volume,
  # then lay the keys out per node (node1..node4, sorted address order).
  genesis:
    <<: *besu
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    volumes:
      - net:/opt/net
      - ./qbftConfig.json:/config/qbftConfig.json:ro
    command:
      - |
        set -e
        if [ -f /opt/net/.ready ]; then echo "network files already generated"; exit 0; fi
        rm -rf /opt/net/gen && mkdir -p /opt/net/gen
        besu operator generate-blockchain-config \
          --config-file=/config/qbftConfig.json \
          --to=/opt/net/gen --private-key-file-name=key
        cp /opt/net/gen/genesis.json /opt/net/genesis.json
        i=1
        for d in $(ls -d /opt/net/gen/keys/*/ | sort); do
          mkdir -p /opt/net/node$$i
          cp "$$d/key" "$$d/key.pub" /opt/net/node$$i/
          echo "node$$i validator: $$(basename $$d)"
          i=$$((i+1))
        done
        touch /opt/net/.ready
        echo "QBFT network files ready"

  node1:
    <<: *besu
    depends_on:
      genesis:
        condition: service_completed_successfully
    environment: *node-args
    ports:
      - "8550:8545"
      # WebSocket JSON-RPC, read-only, used by the explorer for eth_subscribe
      # (newHeads, logs, newPendingTransactions). Published so the explorer can
      # also be served outside Docker: ?ws=ws://127.0.0.1:8551. The campaign
      # itself never uses it; run-poc.sh talks HTTP on 8550.
      - "8551:8546"
    volumes:
      - net:/opt/net
      - node1-data:/opt/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SELF=$$(hostname -i | awk '{print $$1}')
        echo "node1 advertising p2p address $$SELF"
        exec besu --data-path=/opt/data \
          --node-private-key-file=/opt/net/node1/key \
          --p2p-host="$$SELF" --nat-method=NONE \
          --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545 \
          --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL \
          --rpc-http-cors-origins="*" \
          --rpc-ws-enabled --rpc-ws-host=0.0.0.0 --rpc-ws-port=8546 \
          --rpc-ws-api=ETH,NET,WEB3,QBFT,TXPOOL

  node2:
    <<: *besu
    depends_on:
      genesis:
        condition: service_completed_successfully
    environment: *node-args
    volumes:
      - net:/opt/net
      - node2-data:/opt/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Besu requires an IP address inside an enode URL: passing the compose
        # service name directly fails with "Invalid enode URL syntax ...
        # Invalid ip address", the node exits, and QBFT never reaches quorum.
        # node1's address is therefore resolved here, once it is up.
        for _ in $$(seq 1 60); do
          BOOT_IP=$$(getent hosts node1 | awk '{print $$1}' | head -1)
          [ -n "$$BOOT_IP" ] && break
          echo "waiting for node1 to be resolvable..."; sleep 2
        done
        if [ -z "$$BOOT_IP" ]; then echo "could not resolve node1"; exit 1; fi
        SELF=$$(hostname -i | awk '{print $$1}')
        echo "node2: bootnode node1 at $$BOOT_IP, advertising $$SELF"
        exec besu --data-path=/opt/data \
          --node-private-key-file=/opt/net/node2/key \
          --p2p-host="$$SELF" --nat-method=NONE \
          --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545 \
          --rpc-http-api=ETH,NET,WEB3 \
          --bootnodes=enode://$$(sed 's/^0x//' /opt/net/node1/key.pub)@$$BOOT_IP:30303

  node3:
    <<: *besu
    depends_on:
      genesis:
        condition: service_completed_successfully
    environment: *node-args
    volumes:
      - net:/opt/net
      - node3-data:/opt/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Besu requires an IP address inside an enode URL: passing the compose
        # service name directly fails with "Invalid enode URL syntax ...
        # Invalid ip address", the node exits, and QBFT never reaches quorum.
        # node1's address is therefore resolved here, once it is up.
        for _ in $$(seq 1 60); do
          BOOT_IP=$$(getent hosts node1 | awk '{print $$1}' | head -1)
          [ -n "$$BOOT_IP" ] && break
          echo "waiting for node1 to be resolvable..."; sleep 2
        done
        if [ -z "$$BOOT_IP" ]; then echo "could not resolve node1"; exit 1; fi
        SELF=$$(hostname -i | awk '{print $$1}')
        echo "node3: bootnode node1 at $$BOOT_IP, advertising $$SELF"
        exec besu --data-path=/opt/data \
          --node-private-key-file=/opt/net/node3/key \
          --p2p-host="$$SELF" --nat-method=NONE \
          --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545 \
          --rpc-http-api=ETH,NET,WEB3 \
          --bootnodes=enode://$$(sed 's/^0x//' /opt/net/node1/key.pub)@$$BOOT_IP:30303

  node4:
    <<: *besu
    depends_on:
      genesis:
        condition: service_completed_successfully
    environment: *node-args
    volumes:
      - net:/opt/net
      - node4-data:/opt/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Besu requires an IP address inside an enode URL: passing the compose
        # service name directly fails with "Invalid enode URL syntax ...
        # Invalid ip address", the node exits, and QBFT never reaches quorum.
        # node1's address is therefore resolved here, once it is up.
        for _ in $$(seq 1 60); do
          BOOT_IP=$$(getent hosts node1 | awk '{print $$1}' | head -1)
          [ -n "$$BOOT_IP" ] && break
          echo "waiting for node1 to be resolvable..."; sleep 2
        done
        if [ -z "$$BOOT_IP" ]; then echo "could not resolve node1"; exit 1; fi
        SELF=$$(hostname -i | awk '{print $$1}')
        echo "node4: bootnode node1 at $$BOOT_IP, advertising $$SELF"
        exec besu --data-path=/opt/data \
          --node-private-key-file=/opt/net/node4/key \
          --p2p-host="$$SELF" --nat-method=NONE \
          --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545 \
          --rpc-http-api=ETH,NET,WEB3 \
          --bootnodes=enode://$$(sed 's/^0x//' /opt/net/node1/key.pub)@$$BOOT_IP:30303

volumes:
  net:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
