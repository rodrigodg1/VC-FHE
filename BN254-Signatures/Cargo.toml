[package]
name = "lhs-verification"
version = "0.1.0"
edition = "2021"

[dependencies]
# Common dependencies (TFHE is configured per-architecture below)

ark-bn254 = "0.4.0"
ark-ec = "0.4.0"
ark-ff = "0.4.0"
ark-std = "0.4.0"
ark-serialize = "0.4.0"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ethers = { version = "2.0", features = ["abigen"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"

# Threshold cryptography for simulated threshold decryption
sharks = "0.5"
num-bigint = "0.4"
num-traits = "0.2"
bincode = "1.3"

# TFHE: architecture-specific backend (selected automatically)
[target.'cfg(target_arch = "x86_64")'.dependencies]
tfhe = { version = "0.7.2", default-features = false, features = ["integer", "x86_64-unix"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
tfhe = { version = "0.7.2", default-features = false, features = ["integer", "aarch64-unix"] }

