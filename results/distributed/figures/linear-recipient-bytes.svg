    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>Test PoC, functional measurements. Recipient payload comparison without cached inputs, with three full cases per size. Bars show means and error bars show sample standard deviations. The baseline input size is a serialization model. The baseline reconstructs its result and need not receive a second aggregate. Authorization and KMS traffic are excluded. These sizes do not measure network latency or total communication.</dc:description>
