    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>Test PoC, functional measurements. Linear admission and aggregate verification, with 100 paired observations per size. Bars show means and error bars show sample standard deviations, not confidence intervals. The constant-cost final contract check is not timed in isolation. Preparation, recipient verification and decryption are outside these component times.</dc:description>
