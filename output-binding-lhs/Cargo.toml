[package]
name = "output-binding-lhs"
version = "0.1.0"
edition = "2021"
description = "Field-level mirror of the output-bound multi-key linear verification path: per-owner context-bound BLS signatures over a Pedersen ciphertext-vector commitment, with the same MapToGroup map, context encoding and acceptance predicate as MKLHS-Verification.sol."

[[bin]]
name = "output-binding-lhs"
path = "src/main.rs"

[dependencies]
ark-bn254 = "0.4.0"
ark-ec = "0.4.0"
ark-ff = "0.4.0"
ark-std = "0.4.0"
ark-serialize = "0.4.0"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
